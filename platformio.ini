; Card Craft — PlatformIO project configuration.
;
; A first-person survival raycaster. One env per board: board-specific code
; lives in src/hal/hal_<board>.cpp, selected by the -D BOARD_<X> flag below,
; and nothing in src/ outside hal/ names a device.
;
; Platform: pioarduino (community-maintained espressif32 fork) — the official
; espressif32 platform stopped at Arduino core 2.x, and M5Cardputer needs 3.x.

; A bare `pio run` builds the firmware only. The other envs are opt-in: the
; screenshot tour needs a device attached, and `native` is a test-only env with
; no main() of its own.
[platformio]
default_envs = cardputer

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; -O3 rather than the Arduino default -Os: this is a game, and the raycast and
; span loops are the whole frame budget.
build_flags = -Wall -Wno-unused-function -O3 -falign-functions=16 -falign-loops=16
; -ffast-math is scoped to src/ deliberately — it must not reach M5GFX or the
; Arduino core, where relaxed float semantics buy nothing and could surprise.
build_src_flags = -ffast-math

; M5Stack Cardputer and Cardputer ADV. Both carry the same StampS3 module
; (ESP32-S3FN8, 8 MB flash, no PSRAM) and produce the same image: the keyboard
; controller differs (original: IO matrix, ADV: TCA8418) but M5Cardputer picks
; it at runtime, and M5GFX autodetects the display. One firmware.bin, two boards.
[env:cardputer]
board = m5stack-stamps3
board_build.flash_mode = qio
build_flags = ${env.build_flags} -D BOARD_CARDPUTER
lib_deps = m5stack/M5Cardputer@^1.1.1
; The four files in the frame's path are compiled as one translation unit
; through src/unity.cpp, so they are excluded here rather than deleted.
build_src_filter = +<*> -<world.cpp> -<raycast.cpp> -<game.cpp> -<render.cpp>

; The same firmware with the developer instruments switched on: frame-time
; telemetry over USB CDC and the screenshot responder that regenerates the
; README images. Not part of the shipped build.
;   pio run -e cardputer-dev -t upload && ./tools/grab-screenshots.py --tour
[env:cardputer-dev]
extends = env:cardputer
build_flags = ${env:cardputer.build_flags} -D SHOW_FPS -D DEV_SERIAL -D ARDUINO_USB_CDC_ON_BOOT=1

; The dev build with block textures compiled out, so their cost can be measured
; rather than asserted. Not a shipping configuration.
[env:cardputer-notex]
extends = env:cardputer-dev
build_flags = ${env:cardputer-dev.build_flags} -D NO_TEXTURES

; Host tests for the parts with no hardware in them: the world grid and its
; worldgen, the raycaster, and the survival simulation.  pio test -e native
[env:native]
platform = native
framework =
build_flags = -std=gnu++17 -Wall -I src
build_src_filter = +<world.cpp> +<raycast.cpp> +<game.cpp> +<settings.cpp>
test_build_src = yes
;
; =============================================================================
;  Cardputer-ADV envs
;
;  These live in this file rather than a second one on purpose: PlatformIO keys
;  its build directory on a checksum of the project configuration, so switching
;  between `-c platformio.ini` and `-c platformio-adv.ini` wipes .pio/build --
;  including the environment that was not being built -- every single time.
;  That bit twice before it was noticed.
;
;    pio run  -e adv              the firmware
;    pio run  -e adv-selftest     the same sources plus a boot-time SD self-test
;    pio test -e native           host tests
; =============================================================================

; Local build config for the Cardputer ADV (ESP32-S3FN8, 8 MB, no PSRAM).
;
; Upstream pins pioarduino 55.03.39 (Arduino core 3.x) because "M5Cardputer
; needs 3.x". That is not true of M5Cardputer 1.1.1 -- the EMBER build on this
; machine compiles the same library against Arduino core 2.0.16 and runs on this
; exact board -- and the core-3 platform is a ~1.5 GB download over a link that
; delivers 390 KB/s. So this env reuses the toolchain and the library trees that
; already build and flash for the Cardputer ADV here.
;

[env:adv]
platform = espressif32 @ 6.7.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
build_flags =
	-DESP32S3
	-DBOARD_CARDPUTER
	-Wall
	-Wno-unused-function
	-O3
	-falign-functions=16
	-falign-loops=16
; -std=gnu++17 for the project's own sources only. Upstream relies on it
; implicitly -- Arduino core 3.x defaults to gnu++17 and core 2.0.16 does not --
; and this tree genuinely needs it in three places: render::pack() is a
; multi-statement constexpr, ui::MenuItem is brace-initialised (an aggregate
; with default member initialisers is C++14 and later), and sfx.cpp static_asserts
; a loop-computed constexpr. Scoped to src/ so the core and M5GFX keep the
; standard they were written against.
build_src_flags = -ffast-math -std=gnu++17
; world/raycast/game/render are compiled as one translation unit through
; src/unity.cpp, so they are excluded individually here -- same as upstream.
build_src_filter = +<*> -<world.cpp> -<raycast.cpp> -<game.cpp> -<render.cpp>
; The SD self-test build. Same sources as adv, plus a block in main.cpp that
; writes and reads a save slot at boot and prints the result to the serial
; console -- there is no other way to reach the save card in the emulator, whose
; Cardputer-ADV keyboard does not deliver character keys to the guest. It is not
; a shipping configuration and it is not flashed to the board.
[env:adv-selftest]
extends = env:adv
build_flags = ${env:adv.build_flags} -DCC_SD_SELFTEST

; The four libraries are symlinked into lib/ rather than named in lib_deps.
; lib_deps cannot do it: M5Cardputer declares M5Unified and M5Unified declares
; M5GFX >= 0.3.0, and Library Dependency Finder resolves a declared dependency
; from the registry even when an explicit entry of the same name is already
; listed, so the build stopped at "Installing M5GFX @ >=0.3.0" and stalled at
; 10% of it. Libraries found in lib/ satisfy those declarations first, so the
; registry is never consulted. Its CDN throttles to ~30 KB/s here.
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
